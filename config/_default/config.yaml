baseURL: https://scscriptript.github.io/
title: ScscriptriPt Blog
# {year} 会被自动替换成当前年份，不用手动改。
copyright: "Copyright © {year} ScscriptriPt. All Rights Reserved."
# 本站只做中文，所以固定为 zh-hans；语言清单在 languages.yaml。
defaultContentLanguage: zh-hans
hasCJKLanguage: true # 内容是中文，Hugo 需要这个才能正确统计字数和生成摘要。
# defaultContentLanguageInSubdir: true
# disableLanguages:
#  - fr
#  - zh-cn
#  - zh-tw
pagination:
  pagerSize: 10
# paginatePath: page
enableRobotsTXT: true
enableEmoji: true
pygmentsUseClasses: true

blackfriday:
  hrefTargetBlank: true

taxonomies:
  category: categories
  series: series
  tag: tags
  authors: authors

build:
  writeStats: true

permalinks:
  news: /news/:year/:month/:slug/
  blog: /blog/:year/:month/:slug/

module:
  imports:
    - path: github.com/razonyang/hugo-theme-bootstrap
#   proxy: https://goproxy.cn

# services:
#   disqus:
#     shortname: your-disqus-shortname

markup:
  highlight:
    guessSyntax: true
    lineNos: true
    noClasses: false
    lineNumbersInTable: false
