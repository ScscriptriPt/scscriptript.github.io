# 评论区（giscus）。原来的配置指向主题作者的仓库，读者留言会存到他那里，已删除。
# 以后想开评论区：去 https://giscus.app 按提示装好 GitHub App，它会给你下面四项，填进来即可。
#giscus:
  #repo: "你的用户名/你的仓库" # required.
  #repoId: "生成的编号" # required.
  #category: "General" # required.
  #categoryId: "生成的编号" # required.

