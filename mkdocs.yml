extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/blog-sidebar.js
  - javascripts/external-links.js

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      # 标题悬停显示锚点链接
      permalink: true
      # 让中文标题生成可用的锚点
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          percent_encoded: true
